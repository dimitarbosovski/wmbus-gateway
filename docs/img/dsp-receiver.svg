<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img"><title>Receiver: discriminator, sync correlator, template bank, cancellation</title><style>
svg { color: #26292b; }
.box { fill: #ffffff; stroke: currentColor; stroke-width: 1.2; }
.box-acc { fill: #fdeee5; stroke: #f26522; stroke-width: 1.6; }
.lane { fill: #f6f7f7; stroke: #d3d8da; stroke-width: 1; }
.t { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: currentColor; }
.ts { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5b6366; }
.tb { font: 600 13.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: currentColor; }
.th { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5b6366; letter-spacing: 0.06em; }
.data { stroke: #f26522; stroke-width: 2; fill: none; }
.down { stroke: currentColor; stroke-width: 1.4; fill: none; }
.ctl { stroke: #5b6366; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
.pwr { stroke: currentColor; stroke-width: 3.2; fill: none; }
.pwr2 { stroke: currentColor; stroke-width: 1.8; fill: none; }
.grid { stroke: #d3d8da; stroke-width: 1; stroke-dasharray: 3 4; }
.mk-acc { fill: #f26522; } .mk-fg { fill: currentColor; } .mk-mut { fill: #5b6366; }
.dot { fill: currentColor; } .bar-on { fill: #26292b; } .bar-acc { fill: #f26522; } .bar-low { fill: #d3d8da; }
.wedge { fill: #ffffff; stroke: #d3d8da; stroke-width: 1.2; }
.wedge-hl { fill: #fdeee5; stroke: #f26522; stroke-width: 1.2; }
.mast { fill: #26292b; } .meter { fill: #ffffff; stroke: currentColor; stroke-width: 1.6; }
.tx { font: 600 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5b6366; } .band { fill: #fbf1dc; }
.ghost { fill: none; stroke: #5b6366; stroke-width: 1.4; stroke-dasharray: 5 4; }
</style><rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="mf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-acc" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="mf-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fg" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="box" x="20" y="60" width="120" height="60" rx="6"/>
  <text class="t" x="80" y="86" text-anchor="middle">IQ</text><text class="ts" x="80" y="104" text-anchor="middle">500 kS/s</text>
  <line class="data" x1="140" y1="90" x2="168" y2="90" marker-end="url(#mf-a)"/>
  <rect class="box" x="170" y="60" width="140" height="60" rx="6"/>
  <text class="t" x="240" y="86" text-anchor="middle">FM discrim.</text><text class="ts" x="240" y="104" text-anchor="middle">frequency / sample</text>
  <line class="data" x1="310" y1="90" x2="338" y2="90" marker-end="url(#mf-a)"/>
  <rect class="box" x="340" y="60" width="120" height="60" rx="6"/>
  <text class="t" x="400" y="86" text-anchor="middle">filter</text><text class="ts" x="400" y="104" text-anchor="middle">5 samples/chip</text>
  <line class="data" x1="460" y1="90" x2="488" y2="90" marker-end="url(#mf-a)"/>
  <rect class="box-acc" x="490" y="60" width="150" height="60" rx="6"/>
  <text class="t" x="565" y="86" text-anchor="middle">sync correlator</text><text class="ts" x="565" y="104" text-anchor="middle">16 + 10 chips</text>
  <line class="data" x1="640" y1="90" x2="668" y2="90" marker-end="url(#mf-a)"/>
  <rect class="box-acc" x="670" y="50" width="310" height="80" rx="6"/>
  <text class="t" x="825" y="76" text-anchor="middle">template bank  H · s</text>
  <text class="ts" x="825" y="96" text-anchor="middle">H: meters × 108 chips (T1) / 72 (C1)</text>
  <text class="ts" x="825" y="114" text-anchor="middle">best score → meter + header</text>
  <line class="data" x1="825" y1="130" x2="825" y2="178" marker-end="url(#mf-a)"/>
  <rect class="box" x="700" y="180" width="250" height="56" rx="6"/>
  <text class="t" x="825" y="204" text-anchor="middle">CRC on every block</text><text class="ts" x="825" y="222" text-anchor="middle">decoded telegram → output</text>
  <path class="down" d="M700 208 H612" marker-end="url(#mf-f)"/>
  <rect class="box" x="380" y="180" width="230" height="56" rx="6"/>
  <text class="t" x="495" y="204" text-anchor="middle">re-modulation</text><text class="ts" x="495" y="222" text-anchor="middle">CFO, rate, deviation, phase</text>
  <path class="down" d="M380 208 H302" marker-end="url(#mf-f)"/>
  <rect class="box" x="170" y="180" width="130" height="56" rx="6"/>
  <text class="t" x="235" y="204" text-anchor="middle">cancellation</text><text class="ts" x="235" y="222" text-anchor="middle">IQ − telegram</text>
  <path class="down" d="M235 180 V150 H240 V122" marker-end="url(#mf-f)"/>
  <text class="ts" x="250" y="160">residual → again</text>
  <text class="ts" x="565" y="40" text-anchor="middle">every peak = candidate</text>
  <text class="ts" x="565" y="270" text-anchor="middle">up to 4 cancellations in a row</text>
</svg>
