<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img"><title>Gateway software: STM32, ESP32 and server</title><style>
svg { color: #26292b; }
.box { fill: #ffffff; stroke: currentColor; stroke-width: 1.2; }
.box-acc { fill: #fdeee5; stroke: #f26522; stroke-width: 1.6; }
.lane { fill: #f6f7f7; stroke: #d3d8da; stroke-width: 1; }
.t { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: currentColor; }
.ts { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5b6366; }
.tb { font: 600 13.5px 'Segoe UI', Helvetica, Arial, sans-serif; fill: currentColor; }
.th { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5b6366; letter-spacing: 0.06em; }
.data { stroke: #f26522; stroke-width: 2; fill: none; }
.down { stroke: currentColor; stroke-width: 1.4; fill: none; }
.ctl { stroke: #5b6366; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
.pwr { stroke: currentColor; stroke-width: 3.2; fill: none; }
.pwr2 { stroke: currentColor; stroke-width: 1.8; fill: none; }
.grid { stroke: #d3d8da; stroke-width: 1; stroke-dasharray: 3 4; }
.mk-acc { fill: #f26522; } .mk-fg { fill: currentColor; } .mk-mut { fill: #5b6366; }
.dot { fill: currentColor; } .bar-on { fill: #26292b; } .bar-acc { fill: #f26522; } .bar-low { fill: #d3d8da; }
.wedge { fill: #ffffff; stroke: #d3d8da; stroke-width: 1.2; }
.wedge-hl { fill: #fdeee5; stroke: #f26522; stroke-width: 1.2; }
.mast { fill: #26292b; } .meter { fill: #ffffff; stroke: currentColor; stroke-width: 1.6; }
.tx { font: 600 16px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5b6366; } .band { fill: #fbf1dc; }
.ghost { fill: none; stroke: #5b6366; stroke-width: 1.4; stroke-dasharray: 5 4; }
</style><rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="sw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-acc" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="sw-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-fg" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="sw-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-mut" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="lane" x="16" y="16" width="410" height="472" rx="8"/>
  <rect class="lane" x="440" y="16" width="250" height="472" rx="8"/>
  <rect class="lane" x="710" y="16" width="280" height="472" rx="8"/>
  <text class="th" x="34" y="44">STM32 · COLLECTOR</text>
  <text class="th" x="458" y="44">ESP32 · LTE</text>
  <text class="th" x="728" y="44">SERVER</text>

  <!-- STM32 main flow -->
  <rect class="box" x="36" y="64" width="200" height="36" rx="4"/><text class="t" x="136" y="87" text-anchor="middle">UART1 ← iM891A-XL</text>
  <rect class="box" x="36" y="124" width="200" height="36" rx="4"/><text class="t" x="136" y="147" text-anchor="middle">hci: SLIP + CRC16</text>
  <rect class="box" x="36" y="184" width="200" height="36" rx="4"/><text class="t" x="136" y="207" text-anchor="middle">imst: Rx event 20h</text>
  <rect class="box" x="36" y="244" width="200" height="36" rx="4"/><text class="t" x="136" y="267" text-anchor="middle">M+ID → key</text>
  <rect class="box-acc" x="36" y="304" width="200" height="36" rx="4"/><text class="t" x="136" y="327" text-anchor="middle">oms: mode 5 / 7</text>
  <rect class="box" x="36" y="364" width="200" height="36" rx="4"/><text class="t" x="136" y="387" text-anchor="middle">pool: 1 record/meter</text>
  <rect class="box" x="36" y="424" width="200" height="36" rx="4"/><text class="t" x="136" y="447" text-anchor="middle">link: SAP 80h, UART2</text>
  <line class="data" x1="136" y1="100" x2="136" y2="122" marker-end="url(#sw-a)"/>
  <line class="data" x1="136" y1="160" x2="136" y2="182" marker-end="url(#sw-a)"/>
  <line class="data" x1="136" y1="220" x2="136" y2="242" marker-end="url(#sw-a)"/>
  <line class="data" x1="136" y1="280" x2="136" y2="302" marker-end="url(#sw-a)"/>
  <line class="data" x1="136" y1="340" x2="136" y2="362" marker-end="url(#sw-a)"/>
  <line class="data" x1="136" y1="400" x2="136" y2="422" marker-end="url(#sw-a)"/>
  <text class="ts" x="244" y="236">unknown → counted</text>
  <text class="ts" x="244" y="318">2F2F / MAC error</text>
  <text class="ts" x="244" y="332">→ 1 raw record</text>

  <!-- STM32 side modules -->
  <rect class="box" x="262" y="64" width="150" height="96" rx="4"/>
  <text class="t" x="337" y="86" text-anchor="middle">collector (FSM)</text>
  <text class="ts" x="337" y="106" text-anchor="middle">boot → cfg → listen</text>
  <text class="ts" x="337" y="122" text-anchor="middle">→ upload → sleep</text>
  <text class="ts" x="337" y="142" text-anchor="middle">SW1 / SW2 EN</text>
  <rect class="box" x="262" y="184" width="150" height="36" rx="4"/><text class="t" x="337" y="207" text-anchor="middle">RTC alarm</text>
  <line class="ctl" x1="337" y1="184" x2="337" y2="162" marker-end="url(#sw-m)"/>
  <rect class="box" x="262" y="244" width="150" height="36" rx="4"/><text class="t" x="337" y="267" text-anchor="middle">keystore · flash</text>
  <line class="ctl" x1="262" y1="262" x2="238" y2="262" marker-end="url(#sw-m)"/>
  <path class="ctl" d="M262 150 H249 V202 H238" marker-end="url(#sw-m)"/>

  <!-- STM32 <-> ESP32 -->
  <line class="down" x1="460" y1="436" x2="238" y2="436" marker-end="url(#sw-f)"/>
  <circle class="dot" cx="400" cy="436" r="3.5"/>
  <line class="down" x1="400" y1="436" x2="400" y2="282" marker-end="url(#sw-f)"/>
  <text class="ts" x="392" y="384" text-anchor="end">keys,</text>
  <text class="ts" x="392" y="398" text-anchor="end">cfg, time</text>
  <line class="data" x1="236" y1="452" x2="458" y2="452" marker-end="url(#sw-a)"/>
  <text class="ts" x="348" y="472" text-anchor="middle">LINK_UP_RECORDS</text>

  <!-- ESP32 -->
  <rect class="box" x="460" y="424" width="210" height="36" rx="4"/><text class="t" x="565" y="447" text-anchor="middle">link: SAP 80h</text>
  <rect class="box" x="460" y="304" width="210" height="36" rx="4"/><text class="t" x="565" y="327" text-anchor="middle">EG915N AT driver</text>
  <rect class="box" x="460" y="244" width="210" height="36" rx="4"/><text class="t" x="565" y="267" text-anchor="middle">PWRKEY · attach · TLS</text>
  <rect class="box" x="460" y="184" width="210" height="36" rx="4"/><text class="t" x="565" y="207" text-anchor="middle">MQTT · AT+QMT*</text>
  <line class="data" x1="540" y1="424" x2="540" y2="342" marker-end="url(#sw-a)"/>
  <line class="data" x1="540" y1="304" x2="540" y2="282" marker-end="url(#sw-a)"/>
  <line class="data" x1="540" y1="244" x2="540" y2="222" marker-end="url(#sw-a)"/>
  <line class="down" x1="600" y1="220" x2="600" y2="242" marker-end="url(#sw-f)"/>
  <line class="down" x1="600" y1="280" x2="600" y2="302" marker-end="url(#sw-f)"/>
  <line class="down" x1="600" y1="340" x2="600" y2="422" marker-end="url(#sw-f)"/>
  <text class="ts" x="532" y="386" text-anchor="end">≤ 500 B/frame</text>
  <text class="ts" x="608" y="386">+QMTRECV</text>

  <!-- ESP32 <-> server -->
  <line class="data" x1="670" y1="196" x2="728" y2="196" marker-end="url(#sw-a)"/>
  <line class="down" x1="730" y1="212" x2="672" y2="212" marker-end="url(#sw-f)"/>
  <text class="ts" x="700" y="186" text-anchor="middle">/up</text>
  <text class="ts" x="700" y="230" text-anchor="middle">/down</text>

  <!-- server -->
  <rect class="box" x="730" y="64" width="240" height="36" rx="4"/><text class="t" x="850" y="87" text-anchor="middle">keys + cfg (service)</text>
  <rect class="box" x="730" y="184" width="240" height="36" rx="4"/><text class="t" x="850" y="207" text-anchor="middle">MQTT broker (TLS)</text>
  <rect class="box" x="730" y="244" width="240" height="36" rx="4"/><text class="t" x="850" y="267" text-anchor="middle">ingest: records → DB</text>
  <rect class="box" x="730" y="304" width="240" height="36" rx="4"/><text class="t" x="850" y="327" text-anchor="middle">DIF/VIF parser</text>
  <rect class="box" x="730" y="364" width="240" height="36" rx="4"/><text class="t" x="850" y="387" text-anchor="middle">API · mobile app</text>
  <line class="down" x1="850" y1="100" x2="850" y2="182" marker-end="url(#sw-f)"/>
  <text class="ts" x="858" y="138">cfg: retained</text>
  <text class="ts" x="858" y="152">keys: QoS 1</text>
  <line class="data" x1="850" y1="220" x2="850" y2="242" marker-end="url(#sw-a)"/>
  <line class="data" x1="850" y1="280" x2="850" y2="302" marker-end="url(#sw-a)"/>
  <line class="data" x1="850" y1="340" x2="850" y2="362" marker-end="url(#sw-a)"/>
</svg>
